# Copy .env.example to .env, adjust it, then: docker compose up -d --build
services:
  tracker:
    build: .
    image: card-benefits-tracker
    restart: unless-stopped
    # Run as the host user that owns the data and secrets folders (id -u, id -g).
    user: "${TRACKER_UID:-1000}:${TRACKER_GID:-1000}"
    ports:
      - "${TRACKER_PORT:-8080}:8080"
    environment:
      Tracker__TimeZone: ${TRACKER_TIMEZONE:-America/New_York}
      # Files, not values: the access URL and the mail password never appear in configuration.
      Tracker__SimpleFin__AccessUrlFile: /run/secrets/simplefin-access-url
      Tracker__Smtp__PasswordFile: /run/secrets/smtp-password
      Tracker__Smtp__Host: ${SMTP_HOST:-}
      Tracker__Smtp__Port: ${SMTP_PORT:-587}
      Tracker__Smtp__User: ${SMTP_USER:-}
      Tracker__Smtp__From: ${SMTP_FROM:-}
      Tracker__Smtp__To__0: ${REMINDER_TO_1:-}
      Tracker__Smtp__To__1: ${REMINDER_TO_2:-}
    volumes:
      - ${TRACKER_DATA:-./data}:/data
      - ${TRACKER_SECRETS:-./secrets}:/run/secrets:ro
