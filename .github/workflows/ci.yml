name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # The web app is only wired up correctly if the published output can start it.
      - run: dotnet publish src/Chitragupta.Api --configuration Release --output out
      - run: test -f out/wwwroot/_framework/blazor.webassembly.js && grep -q '_framework/blazor.webassembly.js' out/wwwroot/index.html
