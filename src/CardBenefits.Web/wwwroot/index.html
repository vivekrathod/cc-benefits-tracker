<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Card benefits</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#14324f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
</head>

<body>
    <div id="app">
        <p class="loading">Loading…</p>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // The service worker keeps a copy of the app for fast starts. When the server has a newer
        // build, the new worker takes over and the page reloads once so that it shows that build.
        if ('serviceWorker' in navigator) {
            const hadWorker = !!navigator.serviceWorker.controller;
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hadWorker && !reloading) {
                    reloading = true;
                    location.reload();
                }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(registration => {
                // An app left open on a phone looks for a newer build each time it comes back into view.
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') {
                        registration.update().catch(() => { });
                    }
                });
            });
        }
    </script>
</body>

</html>
